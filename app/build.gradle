plugins {
    id 'com.android.application'
}

android {
    namespace 'com.proyecto.sda'
    compileSdk 35

    defaultConfig {
        applicationId 'com.proyecto.sda'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // FFT: JTransforms 3.1 desde Maven Central (mismo paquete
    // edu.emory.mathcs.jtransforms.fft que la 2.4 del proyecto viejo).
    implementation 'com.github.wendykierp:JTransforms:3.1'
    // Gráficas: MPAndroidChart 3.1.0 desde JitPack. La 2.x que pedía
    // el README viejo NO sirve: el código usa API de la 3.x.
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
}

// kotlin-stdlib 1.8.x ya incluye las clases de jdk7/jdk8: excluir los
// artefactos legacy 1.6.x que llegan transitivos evita Duplicate class.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
